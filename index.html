<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151522"><title>Slap Challenge</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#3c2851,#11111b 65%);color:#fff;font-family:system-ui,"Noto Sans Bengali",sans-serif;display:grid;place-items:center;padding:18px}.game{width:min(100%,560px);text-align:center}.tag{color:#ffb36b;letter-spacing:3px;font-size:12px;font-weight:800}.title{font-size:clamp(32px,8vw,52px);font-weight:950;margin:8px 0}.sub{color:#c9c4d5;margin:0 0 18px}.stats{display:flex;gap:10px;justify-content:center;margin:16px 0}.stat{background:#ffffff12;border:1px solid #ffffff20;border-radius:14px;padding:10px 20px;min-width:105px}.num{font-size:28px;font-weight:900;color:#ffbd69}.stat small{display:block;color:#c9c4d5}.arena{position:relative;overflow:hidden;border-radius:26px;border:3px solid #ffffff24;background:#263b30;box-shadow:0 20px 60px #0008;touch-action:manipulation}.target{display:block;width:100%;height:auto;cursor:pointer;user-select:none;-webkit-user-drag:none;transition:transform .08s}.target.hit{transform:translateX(8px) rotate(2deg) scale(.99);filter:saturate(1.4)}.flash{position:absolute;inset:0;pointer-events:none;background:#ff9d4d55;opacity:0}.flash.on{animation:flash .18s}@keyframes flash{0%{opacity:1}100%{opacity:0}}.impact{position:absolute;pointer-events:none;font-size:clamp(28px,9vw,54px);font-weight:1000;color:#fff;text-shadow:0 3px 0 #c33,0 6px 20px #000;animation:pop .55s forwards}@keyframes pop{0%{transform:scale(.3) rotate(-20deg);opacity:0}30%{transform:scale(1.2) rotate(8deg);opacity:1}100%{transform:translateY(-75px) scale(.8);opacity:0}}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px 0}.btn{border:0;border-radius:14px;padding:13px 22px;font-weight:850;font-size:16px;cursor:pointer}.start{background:#ff743e;color:#21121a;box-shadow:0 5px 0 #b83d25}.sound{background:#ffffff18;color:white;border:1px solid #ffffff30}.hint{font-size:13px;color:#aaa5b8}.result{font-size:20px;font-weight:800;color:#ffd08d;min-height:28px}
</style></head><body><main class="game"><div class="tag">THE 30 SECOND GAME</div><h1 class="title">SLAP CHALLENGE 👋</h1><p class="sub">৩০ সেকেন্ডে যত পারো, ট্যাপ করো!</p><div class="stats"><div class="stat"><div class="num" id="score">0</div><small>SLAPS</small></div><div class="stat"><div class="num" id="time">30</div><small>SECONDS</small></div><div class="stat"><div class="num" id="best">0</div><small>BEST</small></div></div><div class="arena" id="arena"><img class="target" id="target" alt="Slap target" src="target.jpg"><div class="flash" id="flash"></div></div><div class="controls"><button class="btn start" id="start">▶ শুরু করো</button><button class="btn sound" id="sound">🔊 সাউন্ড অন</button></div><div class="result" id="result">শুরু করতে বাটনে চাপ দাও</div><p class="hint">ছবির ওপর ট্যাপ / ক্লিক করলেই স্কোর বাড়বে।</p></main><script>
let score=0,time=30,running=false,timer=null,soundOn=true,ctx;const $=id=>document.getElementById(id);let best=0;try{best=+(localStorage.getItem('slapBest')||0)}catch(e){}$('best').textContent=best;
function beep(){if(!soundOn)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(180,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(75,ctx.currentTime+.09);g.gain.setValueAtTime(.16,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.11);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.12)}catch(e){}}
function hit(e){if(!running)return;score++;$('score').textContent=score;beep();let r=$('arena').getBoundingClientRect(),x=(e.clientX||r.left+r.width/2)-r.left,y=(e.clientY||r.top+r.height/2)-r.top;let p=document.createElement('span');p.className='impact';p.textContent=['থাপ্পড়!','ধপাস!','SLAP!','💥'][Math.floor(Math.random()*4)];p.style.left=Math.max(5,Math.min(r.width-130,x-35))+'px';p.style.top=Math.max(5,y-20)+'px';$('arena').appendChild(p);setTimeout(()=>p.remove(),600);$('target').classList.add('hit');$('flash').classList.remove('on');void $('flash').offsetWidth;$('flash').classList.add('on');setTimeout(()=>$('target').classList.remove('hit'),100)}
function finish(){running=false;clearInterval(timer);$('start').textContent='↻ আবার খেলো';$('result').textContent='দারুণ! তোমার স্কোর: '+score+' 👏';if(score>best){best=score;$('best').textContent=best;try{localStorage.setItem('slapBest',best)}catch(e){}}}
$('start').onclick=()=>{if(running)return;score=0;time=30;running=true;$('score').textContent=0;$('time').textContent=30;$('result').textContent='চালিয়ে যাও!';$('start').textContent='খেলা চলছে…';timer=setInterval(()=>{time--;$('time').textContent=time;if(time<=0)finish()},1000)};
$('arena').addEventListener('pointerdown',hit);$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 সাউন্ড অন':'🔇 সাউন্ড অফ'};
</script></body></html>
