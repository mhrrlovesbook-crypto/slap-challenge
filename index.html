let score=0,time=30,running=false,timer=null,soundOn=true,ctx;const $=id=>document.getElementById(id);let best=0;try{best=+(localStorage.getItem('slapBest')||0)}catch(e){}$('best').textContent=best;
function beep(){if(!soundOn)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(180,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(75,ctx.currentTime+.09);g.gain.setValueAtTime(.16,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.11);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.12)}catch(e){}}
function hit(e){if(!running)return;score++;$('score').textContent=score;beep();let r=$('arena').getBoundingClientRect(),x=(e.clientX||r.left+r.width/2)-r.left,y=(e.clientY||r.top+r.height/2)-r.top;let p=document.createElement('span');p.className='impact';p.textContent=['থাপ্পড়!','ধপাস!','SLAP!','💥'][Math.floor(Math.random()*4)];p.style.left=Math.max(5,Math.min(r.width-130,x-35))+'px';p.style.top=Math.max(5,y-20)+'px';$('arena').appendChild(p);setTimeout(()=>p.remove(),600);$('target').classList.add('hit');$('flash').classList.remove('on');void $('flash').offsetWidth;$('flash').classList.add('on');setTimeout(()=>$('target').classList.remove('hit'),100)}
function finish(){running=false;clearInterval(timer);$('start').textContent='↻ আবার খেলো';$('result').textContent='দারুণ! তোমার স্কোর: '+score+' 👏';if(score>best){best=score;$('best').textContent=best;try{localStorage.setItem('slapBest',best)}catch(e){}}}
$('start').onclick=()=>{if(running)return;score=0;time=30;running=true;$('score').textContent=0;$('time').textContent=30;$('result').textContent='চালিয়ে যাও!';$('start').textContent='খেলা চলছে…';timer=setInterval(()=>{time--;$('time').textContent=time;if(time<=0)finish()},1000)};
$('arena').addEventListener('pointerdown',hit);$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 সাউন্ড অন':'🔇 সাউন্ড অফ'};
